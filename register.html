<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ажилтан бүртгүүлэх — Mongol Metal AI</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#f1f5f9;font-family:Arial,sans-serif;color:#111827}
    .card{width:100%;max-width:430px;background:white;padding:28px;border-radius:16px;box-shadow:0 8px 30px rgba(15,23,42,.08)}
    h1{font-size:24px;margin:0 0 8px}
    p{color:#64748b;line-height:1.55}
    label{display:block;margin:16px 0 6px;font-weight:600}
    input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px}
    button{width:100%;margin-top:20px;padding:13px;background:#2563eb;color:white;border:0;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer}
    #message{margin-top:14px;font-size:14px}
    a{color:#2563eb}
  </style>
</head>
<body>
  <main class="card">
    <h1>Ажилтан бүртгүүлэх</h1>
    <p>Имэйл болон нууц үгээр бүртгэл үүсгэнэ. Бүртгүүлсний дараа админ таны имэйлд ажилтны эрх олгоно.</p>
    <form id="registerForm">
      <label for="email">Имэйл хаяг</label>
      <input id="email" type="email" autocomplete="email" required>
      <label for="password">Нууц үг (дор хаяж 8 тэмдэгт)</label>
      <input id="password" type="password" autocomplete="new-password" minlength="8" required>
      <button type="submit" id="registerButton">Бүртгүүлэх</button>
    </form>
    <div id="message" role="status"></div>
    <p style="margin-top:18px;"><a href="index.html">Нэвтрэх хуудас руу буцах</a></p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseClient = window.supabase.createClient(
      "https://sqywsxbaknjznvohnsim.supabase.co",
      "sb_publishable_CHG1wlFZf2L7n9m99QXMZA_TdWJRXs_"
    );
    document.getElementById("registerForm").addEventListener("submit", async event => {
      event.preventDefault();
      const button = document.getElementById("registerButton");
      const message = document.getElementById("message");
      const email = document.getElementById("email").value.trim().toLowerCase();
      const password = document.getElementById("password").value;
      button.disabled = true;
      button.textContent = "Бүртгэж байна...";
      message.textContent = "";
      try {
        const { data, error } = await supabaseClient.auth.signUp({
          email,
          password,
          options: {}
        });
        if (error) throw error;
        message.textContent = data.session
          ? "Бүртгэл үүслээ. Админ таны имэйлд ажилтны эрх олгосны дараа нэвтэрнэ үү."
          : "Бүртгэл үүслээ. Имэйлээ шалгаж баталгаажуулаад админд имэйл хаягаа мэдэгдэнэ үү.";
        document.getElementById("registerForm").reset();
      } catch (error) {
        message.textContent = "Алдаа: " + error.message;
      } finally {
        button.disabled = false;
        button.textContent = "Бүртгүүлэх";
      }
    });
  </script>
</body>
</html>
