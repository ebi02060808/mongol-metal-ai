<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mongol Metal AI - Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .header {
      height: 70px;
      background: #111827;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    .logout {
      background: #ef4444;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
    }

    .container {
      display: flex;
      min-height: calc(100vh - 70px);
    }

    .sidebar {
      width: 230px;
      background: white;
      padding: 25px 15px;
      border-right: 1px solid #ddd;
    }

    .sidebar button {
      width: 100%;
      padding: 13px;
      margin-bottom: 10px;
      border: none;
      background: #f3f4f6;
      border-radius: 8px;
      text-align: left;
      cursor: pointer;
      font-size: 15px;
    }

    .sidebar button:hover {
      background: #e5e7eb;
    }

    .main {
      flex: 1;
      padding: 30px;
    }

    .welcome {
      margin-bottom: 25px;
    }

    .welcome h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    .card h3 {
      color: #666;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .card .number {
      font-size: 30px;
      font-weight: bold;
    }

    .section {
      background: white;
      padding: 25px;
      border-radius: 12px;
      margin-top: 20px;
    }

    .section h2 {
      margin-bottom: 15px;
    }

    @media (max-width: 900px) {
      .cards {
        grid-template-columns: repeat(2, 1fr);
      }

      .sidebar {
        width: 180px;
      }
    }

    @media (max-width: 600px) {
      .container {
        display: block;
      }

      .sidebar {
        width: 100%;
        border-right: none;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .main {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="logo">Mongol Metal AI</div>
    <button class="logout" onclick="logoutUser()">Гарах</button>
  </header>

  <div class="container">

    <aside class="sidebar">
      <button>📊 Тойм</button>
      <button>📦 Захиалга</button>
      <button>👥 Харилцагч</button>
      <button>💬 Messenger</button>
      <button>⚙️ Тохиргоо</button>
    </aside>

    <main class="main">

      <div class="welcome">
        <h1>Dashboard</h1>
        <p>Тавтай морилно уу, <strong id="userEmail">...</strong></p>
      </div>

      <div class="cards">

        <div class="card">
          <h3>Нийт захиалга</h3>
          <div class="number">0</div>
        </div>

        <div class="card">
          <h3>Шинэ харилцагч</h3>
          <div class="number">0</div>
        </div>

        <div class="card">
          <h3>Messenger чат</h3>
          <div class="number">0</div>
        </div>

        <div class="card">
          <h3>Өнөөдрийн захиалга</h3>
          <div class="number">0</div>
        </div>

      </div>

      <div class="section">
        <h2>📦 Захиалгын мэдээлэл</h2>
        <p>Одоогоор захиалга байхгүй байна.</p>
      </div>

      <div class="section">
        <h2>💬 Messenger</h2>
        <p>Facebook Messenger холболтыг дараагийн шатанд тохируулна.</p>
      </div>

    </main>

  </div>

  <script>

    const SUPABASE_URL = "https://sqywsxbaknjznvohnsim.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_CHG1wlFZf2L7n9m99QXMZA_TdWJRXs_";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    async function checkLogin() {

      const { data: { session } } =
        await supabaseClient.auth.getSession();

      if (!session) {
        window.location.href = "index.html";
        return;
      }

      document.getElementById("userEmail").textContent =
        session.user.email;
    }

    async function logoutUser() {

      await supabaseClient.auth.signOut();

      window.location.href = "index.html";
    }

    checkLogin();

  </script>

</body>
</html>
